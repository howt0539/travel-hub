name: Responsive Guard

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser runtime
        env:
          RUNTIME: ${{ runner.temp }}/responsive-guard
        run: |
          npm install --prefix "$RUNTIME" --no-save playwright@1.62.1
          PLAYWRIGHT_BROWSERS_PATH="$RUNTIME/browsers" \
            "$RUNTIME/node_modules/.bin/playwright" install --with-deps chromium webkit
          cp scripts/responsive-check.mjs "$RUNTIME/responsive-check.mjs"
      - name: Check responsive layout
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/responsive-guard/browsers
          RESPONSIVE_ARTIFACTS_DIR: artifacts/responsive
          RUNTIME: ${{ runner.temp }}/responsive-guard
        run: node "$RUNTIME/responsive-check.mjs" --config .responsive-guard.json
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-failures
          path: artifacts/responsive/
          if-no-files-found: ignore
